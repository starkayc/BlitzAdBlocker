name: ad-scan

# Weekly check for new ad domains in the shipped Blitz app. Blitz ships via
# electron-updater, so https://blitz-main.blitz.gg/latest.yml is the current
# version, and blitz-main.blitz.gg hosts the Setup exe.

on:
  schedule:
    - cron: '0 4 * * 1'   # 04:00 UTC, Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Resolve latest Blitz release
        id: release
        shell: pwsh
        run: |
          # electron-updater feed. Content-Type is octet-stream, so the body
          # arrives as a byte[] and needs decoding before it can be matched.
          $base = 'https://blitz-main.blitz.gg'
          $resp = Invoke-WebRequest "$base/latest.yml" -UseBasicParsing
          $txt = if ($resp.Content -is [byte[]]) { [Text.Encoding]::UTF8.GetString($resp.Content) } else { [string]$resp.Content }
          $ver  = [regex]::Match($txt, '(?m)^version:\s*(\S+)').Groups[1].Value
          $file = [regex]::Match($txt, '(?m)^path:\s*(\S+)').Groups[1].Value
          $sha  = [regex]::Match($txt, '(?m)^sha512:\s*(\S+)').Groups[1].Value
          if (-not $ver -or -not $file -or -not $sha) { throw "cannot parse $base/latest.yml" }
          "Update feed version: $ver ($file)" | Out-Host
          "url=$base/$file" >> $env:GITHUB_OUTPUT
          "version=$ver"    >> $env:GITHUB_OUTPUT
          "sha512=$sha"     >> $env:GITHUB_OUTPUT

      - name: Download Blitz Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri '${{ steps.release.outputs.url }}' -OutFile 'blitz-setup.exe' -UseBasicParsing
          $actual = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash 'blitz-setup.exe' -Algorithm SHA512).Hash))
          if ($actual -ne '${{ steps.release.outputs.sha512 }}') { throw 'blitz-setup.exe sha512 does not match latest.yml' }

      - name: Install silently
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath (Resolve-Path 'blitz-setup.exe') -ArgumentList '/S'
          $app = "$env:LOCALAPPDATA\Programs\Blitz"
          if (-not (Test-Path "$app\resources\app.asar")) { throw "app.asar missing after install: $app" }
          "... installed ${{ steps.release.outputs.version }}" | Out-Host

      - name: Extract app.asar
        shell: pwsh
        run: npx -y @electron/asar extract "$env:LOCALAPPDATA\Programs\Blitz\resources\app.asar" scan-out

      - name: Scan bundles for new ad domains
        id: scan
        shell: pwsh
        run: pwsh scripts/sync-ad-domains.ps1 -AppDir scan-out

      - name: Open PR with new domains
        shell: pwsh
        run: |
          $changed = git status --porcelain -- src/BlitzAdBlocker/BlockedDomains.cs
          if (-not $changed) {
            echo 'no changes — nothing to do'
            exit 0
          }
          git config user.name 'BlitzAdBlocker bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $ver = '${{ steps.release.outputs.version }}'
          pwsh scripts/generate-adguard-list.ps1
          git add src/BlitzAdBlocker/BlockedDomains.cs blitz-adblock.txt
          git commit -m "ad-scan: new ad domains in Blitz $ver"
          git push origin "HEAD:ad-scan/update"
          $title = "ad-scan: new ad domains in Blitz $ver"
          $body = "Automated scan of the shipped Blitz bundle found new ad-network hosts.`n`nReview before merging — the hosts block goes into effect on the next app release."
          $open = gh pr list --head ad-scan/update --state open --json number
          if ($open -match '\d') {
            gh pr edit --title $title --body $body
          } else {
            gh pr create --title $title --body $body --head ad-scan/update
          }